apiVersion: 1

# Fuentes de datos InfluxDB — entorno Docker SISCOM
# UIDs coinciden exactamente con los que referencian los 4 dashboards JSON.
datasources:
  - name: InfluxDB-Raw
    uid: efmenrhxbdclcc          # UID usado en 1_monitoreo_general, 2_detalle_parcela, 4_analisis_historico
    type: influxdb
    access: proxy
    url: http://influxdb:8086    # hostname del servicio en la red Docker
    isDefault: true
    jsonData:
      version: Flux
      organization: agricultura
      defaultBucket: agro_iot_data
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_TOKEN}     # inyectado desde docker-compose environment

  - name: InfluxDB-Indicadores
    uid: dfmeo4l5pa0w0f          # UID usado en 1_monitoreo, 2_detalle, 3_centro_alertas, 4_historico
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: false
    jsonData:
      version: Flux
      organization: agricultura
      defaultBucket: agro_iot_indicadores
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_TOKEN}
